[package]
name = "alvenqis-node"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Draft private devnet CLI for Alvenqis Network"

[features]
default = []
storage-rocksdb = [
    "dep:chacha20poly1305",
    "dep:rand",
    "dep:rocksdb",
    "dep:zeroize",
]

[dependencies]
atomic-write-file = "0.3"
chacha20poly1305 = { version = "=0.10.1", optional = true }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
fs2 = "0.4"
futures = "0.3"
libp2p-connection-limits = "0.6"
libp2p-core = { version = "0.43", features = ["serde"] }
libp2p-gossipsub = { version = "0.49", features = ["serde"] }
libp2p-identify = "0.47"
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand", "serde"] }
libp2p-noise = "0.46"
libp2p-ping = "0.47"
libp2p-request-response = { version = "0.29", features = ["json"] }
libp2p-swarm = { version = "0.47", features = ["macros", "tokio"] }
libp2p-tcp = { version = "0.44", features = ["tokio"] }
libp2p-yamux = "0.47"
multiaddr = "0.18"
rand = { version = "0.8", optional = true }
rocksdb = { version = "=0.24.0", optional = true, default-features = false, features = ["bindgen-runtime", "lz4"] }
rusqlite = { version = "=0.39.0", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
zeroize = { version = "1.8", optional = true }
alvenqis-core = { path = "../alvenqis-core" }

[dev-dependencies]
tempfile = "3"
