[package]
name = "alvenqis-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
alvenqis-core = { path = "../alvenqis-core" }
alvenqis-node = { path = "../alvenqis-node", features = ["fuzzing"] }
libfuzzer-sys = "0.4"
serde_json = "1"

[[bin]]
name = "decode_block"
path = "fuzz_targets/decode_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_transaction"
path = "fuzz_targets/decode_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_p2p_message"
path = "fuzz_targets/decode_p2p_message.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[patch.crates-io]
# Keep the standalone fuzz workspace on the same reviewed fixed Yamux adapter
# as the main and native-helper workspaces.
libp2p-yamux = { path = "../third-party/libp2p-yamux" }
