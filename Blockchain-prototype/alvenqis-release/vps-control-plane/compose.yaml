name: ${COMPOSE_PROJECT_NAME:-alvenqis-control-plane}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-3}

x-service-guardrails: &service-guardrails
  restart: unless-stopped
  networks: [alvenqis-internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  stop_grace_period: 30s
  logging: *default-logging

x-runtime-image: &runtime-image
  <<: *service-guardrails
  image: ${ALVENQIS_RUNTIME_IMAGE:-ghcr.io/zedkode/alvenqis-runtime}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
  build:
    context: ${ALVENQIS_HOST_REPO:-../..}
    dockerfile: alvenqis-release/vps-control-plane/docker/Dockerfile

x-runtime-common: &runtime-common
  <<: *runtime-image
  env_file: [.env]
  volumes:
    - ./state/config/generated:/config
    - ./state/data:/data/.alvenqis-mainnet
  read_only: true
  tmpfs: [/tmp:size=128m]

services:
  alvenqis-node:
    # hardening-review: inherits read_only, no-new-privileges and cap_drop ALL.
    <<: *runtime-common
    container_name: alvenqis-node
    environment: {ALVENQIS_COMPONENT: node}
    ports: ["${P2P_PORT:-20787}:20787/tcp"]
    healthcheck:
      test: ["CMD-SHELL", "ps -C alvenqis-node -o stat= | grep -Eq '^[^Z]' && test -s /data/.alvenqis-mainnet/chain/chain.sqlite3 && test -s /data/.alvenqis-mainnet/node/runtime.json"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: ${NODE_MEMORY_LIMIT:-2304M}
    cpus: ${NODE_CPU_LIMIT:-2.25}
    pids_limit: 512
    stop_grace_period: 90s
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_keepalive_time: "60"
      net.ipv4.tcp_keepalive_intvl: "15"
      net.ipv4.tcp_keepalive_probes: "4"

  alvenqis-rpc:
    <<: *runtime-common
    container_name: alvenqis-rpc
    environment:
      ALVENQIS_COMPONENT: rpc
      # One gateway owns chain reads/writes. Mining remains Docker-internal:
      # the edge gateway retires every public /mining route with HTTP 410.
      RPC_ACCESS_MODE: public-submit
      RPC_EXPOSE_MINING: "true"
    depends_on:
      alvenqis-node: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10787/health >/dev/null && curl -fsS http://127.0.0.1:10787/status | grep -q '\"initialized\":true'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${RPC_MEMORY_LIMIT:-1536M}
    cpus: ${RPC_CPU_LIMIT:-1.25}
    pids_limit: 384
    ulimits:
      nofile: {soft: 32768, hard: 32768}

  alvenqis-indexer:
    <<: *runtime-common
    container_name: alvenqis-indexer
    environment:
      ALVENQIS_COMPONENT: indexer
      INDEXER_INTERVAL_SECONDS: ${INDEXER_INTERVAL_SECONDS:-5}
      INDEXER_FAILURE_BACKOFF_MAX_SECONDS: ${INDEXER_FAILURE_BACKOFF_MAX_SECONDS:-60}
    depends_on:
      alvenqis-node: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '^alvenqis-indexer ' >/dev/null && test -s /data/.alvenqis-mainnet/indexer/.last-success && find /data/.alvenqis-mainnet/indexer/.last-success -mmin -10 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 180s
    mem_limit: ${INDEXER_MEMORY_LIMIT:-768M}
    cpus: ${INDEXER_CPU_LIMIT:-0.75}
    pids_limit: 256

  alvenqis-control:
    <<: *runtime-image
    container_name: alvenqis-control
    env_file: [.env]
    environment:
      ALVENQIS_COMPONENT: control
      ALVENQIS_DEPLOYMENT_MODE: docker
    volumes:
      - ./state/config/generated:/config
      - ./state/control:/data/control
    depends_on:
      alvenqis-rpc: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10788/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${CONTROL_MEMORY_LIMIT:-384M}
    cpus: ${CONTROL_CPU_LIMIT:-0.35}

  stratum-certbot:
    <<: *service-guardrails
    image: certbot/dns-cloudflare:v5.7.0
    container_name: alvenqis-stratum-certbot
    profiles: [pool]
    env_file: [.env]
    entrypoint: ["/bin/sh", "/scripts/certbot-loop.sh"]
    volumes:
      - ./docker/stratum/certbot-loop.sh:/scripts/certbot-loop.sh:ro
      - ./state/stratum/letsencrypt:/etc/letsencrypt
      - ./state/stratum/lib:/var/lib/letsencrypt
    secrets: [cloudflare_api_token]
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/letsencrypt/live/${STRATUM_HOST}/fullchain.pem && test -s /etc/letsencrypt/live/${STRATUM_HOST}/privkey.pem && test -s /etc/letsencrypt/.stratum-cert-ready"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 15s
    mem_limit: ${CERTBOT_MEMORY_LIMIT:-256M}
    cpus: ${CERTBOT_CPU_LIMIT:-0.20}
    pids_limit: 128

  alvenqis-pool:
    <<: *runtime-image
    container_name: alvenqis-pool
    profiles: [pool]
    env_file: [.env]
    environment: {ALVENQIS_COMPONENT: pool}
    ports: ["${STRATUM_PORT:-3333}:${STRATUM_INTERNAL_PORT:-3333}/tcp"]
    volumes:
      - ./state/config/generated:/config
      - ./state/pool:/data/pool
      - ./state/stratum/letsencrypt:/certs:ro
    secrets: [pool_admin_token]
    depends_on:
      alvenqis-rpc: {condition: service_healthy}
      stratum-certbot: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30787/health | grep -q '\"stratum_tls\":true' && curl -fsS http://127.0.0.1:30787/api/v1/pool/status | grep -q '\"upstream_status\":\"healthy\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: ${POOL_MEMORY_LIMIT:-768M}
    cpus: ${POOL_CPU_LIMIT:-0.75}
    pids_limit: 512
    stop_grace_period: 60s
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_keepalive_time: "60"
      net.ipv4.tcp_keepalive_intvl: "15"
      net.ipv4.tcp_keepalive_probes: "4"

  docker-broker:
    <<: *service-guardrails
    image: ${ALVENQIS_OPS_IMAGE:-ghcr.io/zedkode/alvenqis-ops}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
    build:
      context: ${ALVENQIS_HOST_WORKSPACE:-.}
      dockerfile: docker/ops/Dockerfile
    container_name: alvenqis-docker-broker
    working_dir: /app
    env_file: [.env]
    environment:
      ALVENQIS_WORKSPACE: ${ALVENQIS_HOST_WORKSPACE}
      ALVENQIS_COMPOSE_FILE: ${ALVENQIS_HOST_WORKSPACE}/compose.yaml
      ALVENQIS_HOST_WORKSPACE: ${ALVENQIS_HOST_WORKSPACE}
      ALVENQIS_HOST_REPO: ${ALVENQIS_HOST_REPO}
      BROKER_TOKEN_FILE: /run/secrets/broker_token
    command: ["gunicorn", "--bind", "0.0.0.0:8090", "--workers", "1", "--threads", "2", "--timeout", "7200", "broker:app"]
    volumes:
      - ${ALVENQIS_HOST_WORKSPACE}:${ALVENQIS_HOST_WORKSPACE}
      - ${ALVENQIS_HOST_REPO}:${ALVENQIS_HOST_REPO}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    secrets: [broker_token, cloudflare_api_token, backup_passphrase, r2_secret_access_key]
    read_only: true
    tmpfs: [/tmp:size=256m]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: ${BROKER_MEMORY_LIMIT:-384M}
    cpus: ${BROKER_CPU_LIMIT:-0.35}
    pids_limit: 256
    ulimits:
      nofile: {soft: 32768, hard: 32768}

  alvenqis-ops:
    <<: *service-guardrails
    image: ${ALVENQIS_OPS_IMAGE:-ghcr.io/zedkode/alvenqis-ops}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
    build:
      context: ${ALVENQIS_HOST_WORKSPACE:-.}
      dockerfile: docker/ops/Dockerfile
    container_name: alvenqis-ops
    env_file: [.env]
    environment:
      ALVENQIS_WORKSPACE: /workspace
      SETUP_TOKEN_FILE: /run/secrets/setup_token
      BROKER_URL: http://docker-broker:8090
      BROKER_TOKEN_FILE: /run/secrets/broker_token
      DISCORD_WEBHOOK_FILE: /run/secrets/discord_webhook
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    volumes:
      - ./.env:/workspace/.env
      - ./state:/workspace/state
    secrets: [setup_token, broker_token, discord_webhook, telegram_bot_token]
    depends_on:
      docker-broker: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=128m]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: ${OPS_MEMORY_LIMIT:-384M}
    cpus: ${OPS_CPU_LIMIT:-0.35}
    pids_limit: 256

  alvenqis-website:
    <<: *service-guardrails
    image: ${ALVENQIS_WEBSITE_IMAGE:-ghcr.io/zedkode/alvenqis-website}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
    build:
      context: ${ALVENQIS_HOST_REPO:-../..}/alvenqis-website
      dockerfile: Dockerfile
      args:
        VITE_ALVENQIS_RPC_URL: https://${RPC_HOST}
        VITE_ALVENQIS_POOL_URL: https://${POOL_HOST}
        VITE_ALVENQIS_EXPLORER_URL: https://${EXPLORER_HOST}
    container_name: alvenqis-website
    read_only: true
    tmpfs: [/tmp:size=32m]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 8
    mem_limit: ${WEBSITE_MEMORY_LIMIT:-192M}
    cpus: ${WEBSITE_CPU_LIMIT:-0.15}
    pids_limit: 128

  alvenqis-explorer:
    <<: *service-guardrails
    image: ${ALVENQIS_EXPLORER_IMAGE:-ghcr.io/zedkode/alvenqis-explorer}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
    build:
      context: ${ALVENQIS_HOST_REPO:-../..}/alvenqis-explorer
      dockerfile: Dockerfile
      args:
        VITE_ALVENQIS_RPC_URL: https://${RPC_HOST}
    container_name: alvenqis-explorer
    read_only: true
    tmpfs: [/tmp:size=32m]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 8
    mem_limit: ${EXPLORER_MEMORY_LIMIT:-192M}
    cpus: ${EXPLORER_CPU_LIMIT:-0.15}
    pids_limit: 128

  gateway:
    <<: *service-guardrails
    image: ${ALVENQIS_GATEWAY_IMAGE:-ghcr.io/zedkode/alvenqis-gateway}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
    build:
      context: ${ALVENQIS_HOST_WORKSPACE:-.}/docker/gateway
      dockerfile: Dockerfile
    container_name: alvenqis-gateway
    env_file: [.env]
    secrets: [admin_password]
    depends_on:
      alvenqis-control: {condition: service_started}
      alvenqis-rpc: {condition: service_started}
      alvenqis-ops: {condition: service_started}
      alvenqis-website: {condition: service_healthy}
      alvenqis-explorer: {condition: service_healthy}
      grafana: {condition: service_started}
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/gateway-health"]
      interval: 20s
      timeout: 5s
      retries: 8
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-192M}
    cpus: ${GATEWAY_CPU_LIMIT:-0.20}
    pids_limit: 256

  cloudflared:
    <<: *service-guardrails
    image: cloudflare/cloudflared:2026.7.2
    container_name: alvenqis-cloudflared
    profiles: [cloudflare]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets: [cloudflare_tunnel_token]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: ${CLOUDFLARED_MEMORY_LIMIT:-256M}
    cpus: ${CLOUDFLARED_CPU_LIMIT:-0.20}
    pids_limit: 128

  prometheus:
    <<: *service-guardrails
    image: prom/prometheus:v3.5.0
    container_name: alvenqis-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}", "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}", "--web.enable-lifecycle"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./state/prometheus:/prometheus
    depends_on:
      alertmanager: {condition: service_started}
      blackbox-exporter: {condition: service_started}
      alvenqis-metrics-exporter: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-768M}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.50}
    pids_limit: 256

  alertmanager:
    <<: *service-guardrails
    image: prom/alertmanager:v0.28.1
    container_name: alvenqis-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./state/config/generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./state/alertmanager:/alertmanager
    secrets: [smtp_password]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: ${ALERTMANAGER_MEMORY_LIMIT:-128M}
    cpus: ${ALERTMANAGER_CPU_LIMIT:-0.10}
    pids_limit: 128

  blackbox-exporter:
    <<: *service-guardrails
    image: prom/blackbox-exporter:v0.27.0
    container_name: alvenqis-blackbox-exporter
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes: ["./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    healthcheck:
      test: ["CMD", "/bin/blackbox_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: ${BLACKBOX_MEMORY_LIMIT:-128M}
    cpus: ${BLACKBOX_CPU_LIMIT:-0.10}
    pids_limit: 128

  node-exporter:
    <<: *service-guardrails
    image: prom/node-exporter:v1.9.1
    container_name: alvenqis-node-exporter
    pid: host
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    volumes:
      - /:/host:ro,rslave
      - ./state/metrics:/textfile:ro
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}
    cpus: ${NODE_EXPORTER_CPU_LIMIT:-0.10}
    pids_limit: 128

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: alvenqis-cadvisor
    restart: unless-stopped
    networks: [alvenqis-internal]
    privileged: true
    security_opt: [no-new-privileges:true]
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,hugetlb,referenced_memory,resctrl,udp,advtcp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    healthcheck:
      test: ["CMD", "/usr/bin/cadvisor", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging
    mem_limit: ${CADVISOR_MEMORY_LIMIT:-256M}
    cpus: ${CADVISOR_CPU_LIMIT:-0.15}
    pids_limit: 256

  alvenqis-metrics-exporter:
    <<: *service-guardrails
    build:
      context: ${ALVENQIS_HOST_WORKSPACE:-.}/docker/metrics-exporter
      dockerfile: Dockerfile
    image: ${ALVENQIS_METRICS_IMAGE:-ghcr.io/zedkode/alvenqis-metrics-exporter}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
    container_name: alvenqis-metrics-exporter
    environment:
      ALVENQIS_RPC_URL: http://alvenqis-rpc:10787
      ALVENQIS_POOL_URL: http://alvenqis-pool:30787
      ALVENQIS_CONTROL_URL: http://alvenqis-control:10788/health
      ALVENQIS_OPS_URL: http://alvenqis-ops:8080/health
      ENABLE_POOL: ${ENABLE_POOL:-false}
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "9101"
      SCRAPE_TIMEOUT_SECONDS: ${METRICS_SCRAPE_TIMEOUT_SECONDS:-3}
      CACHE_TTL_SECONDS: ${METRICS_CACHE_TTL_SECONDS:-10}
    depends_on:
      alvenqis-rpc: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    read_only: true
    tmpfs: [/tmp:size=16m]
    mem_limit: ${METRICS_MEMORY_LIMIT:-192M}
    cpus: ${METRICS_CPU_LIMIT:-0.20}
    pids_limit: 128

  loki:
    <<: *service-guardrails
    image: grafana/loki:3.5.1
    container_name: alvenqis-loki
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_HOURS: ${LOKI_RETENTION_HOURS:-168}
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - ./state/loki:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: ${LOKI_MEMORY_LIMIT:-768M}
    cpus: ${LOKI_CPU_LIMIT:-0.40}
    pids_limit: 256

  alloy:
    <<: *service-guardrails
    image: grafana/alloy:v1.9.2
    container_name: alvenqis-alloy
    user: "473:0"
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./state/alloy:/var/lib/alloy/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki: {condition: service_started}
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: ${ALLOY_MEMORY_LIMIT:-256M}
    cpus: ${ALLOY_CPU_LIMIT:-0.20}
    pids_limit: 256

  grafana:
    <<: *service-guardrails
    image: grafana/grafana:12.0.2
    container_name: alvenqis-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets: [grafana_password]
    volumes:
      - ./state/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: {condition: service_started}
      loki: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512M}
    cpus: ${GRAFANA_CPU_LIMIT:-0.35}
    pids_limit: 256

  backup-scheduler:
    <<: *service-guardrails
    build:
      context: ${ALVENQIS_HOST_WORKSPACE:-.}
      dockerfile: docker/backup-scheduler/Dockerfile
    image: ${ALVENQIS_BACKUP_IMAGE:-ghcr.io/zedkode/alvenqis-backup-scheduler}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
    container_name: alvenqis-backup-scheduler
    profiles: [backup]
    environment:
      BROKER_URL: http://docker-broker:8090
      BROKER_TOKEN_FILE: /run/secrets/broker_token
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_INITIAL_DELAY_SECONDS: ${BACKUP_INITIAL_DELAY_SECONDS:-3600}
    secrets: [broker_token]
    depends_on:
      docker-broker: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=16m]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    mem_limit: ${BACKUP_MEMORY_LIMIT:-128M}
    cpus: ${BACKUP_CPU_LIMIT:-0.10}
    pids_limit: 128

networks:
