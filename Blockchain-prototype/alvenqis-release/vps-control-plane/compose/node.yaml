x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-3}

x-service-guardrails: &service-guardrails
  restart: unless-stopped
  networks: [alvenqis-internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  stop_grace_period: 30s
  logging: *default-logging

x-runtime-image: &runtime-image
  <<: *service-guardrails
  image: ${ALVENQIS_RUNTIME_IMAGE:-ghcr.io/zedkode/alvenqis-runtime}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
  build:
    context: ${ALVENQIS_HOST_ROOT:-../../..}
    dockerfile: Blockchain-prototype/alvenqis-release/vps-control-plane/docker/Dockerfile

x-runtime-common: &runtime-common
  <<: *runtime-image
  env_file: [.env]
  secrets: [alvenqis_storage_key]
  volumes:
    - ${ALVENQIS_STATE_ROOT:-./state}/config/generated:/config
    - ${ALVENQIS_STATE_ROOT:-./state}/data:/data/.alvenqis-mainnet
    - ${ALVENQIS_STATE_ROOT:-./state}/backups/rocksdb-repository:/backups/rocksdb-repository
  read_only: true
  tmpfs: [/tmp:size=128m]

services:
  alvenqis-node:
    <<: *runtime-common
    environment: {ALVENQIS_COMPONENT: node}
    ports: ["${P2P_BIND_ADDRESS:-0.0.0.0}:${P2P_PORT:-20787}:20787/tcp"]
    healthcheck:
      test: ["CMD-SHELL", "ps -C alvenqis-node -o stat= | grep -Eq '^[^Z]' && test -s /data/.alvenqis-mainnet/chain/chain.sqlite3 && test -s /data/.alvenqis-mainnet/chain/state.rocksdb/CURRENT && test -s /data/.alvenqis-mainnet/node/runtime.json"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: ${NODE_MEMORY_LIMIT:-2304M}
    cpus: ${NODE_CPU_LIMIT:-2.25}
    pids_limit: 512
    stop_grace_period: 90s
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_keepalive_time: "60"
      net.ipv4.tcp_keepalive_intvl: "15"
      net.ipv4.tcp_keepalive_probes: "4"
