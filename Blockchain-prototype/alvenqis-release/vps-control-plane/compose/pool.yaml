x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-3}

x-service-guardrails: &service-guardrails
  restart: unless-stopped
  networks: [alvenqis-internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  stop_grace_period: 30s
  logging: *default-logging

x-runtime-image: &runtime-image
  <<: *service-guardrails
  image: ${ALVENQIS_RUNTIME_IMAGE:-ghcr.io/zedkode/alvenqis-runtime}:${ALVENQIS_VERSION:-2.1.0-no-autoupdate}
  build:
    context: ${ALVENQIS_HOST_ROOT:-../../..}
    dockerfile: Blockchain-prototype/alvenqis-release/vps-control-plane/docker/Dockerfile

services:
  stratum-certbot:
    <<: *service-guardrails
    image: certbot/dns-cloudflare:v5.7.0
    env_file: [.env]
    entrypoint: ["/bin/sh", "/scripts/certbot-loop.sh"]
    volumes:
      - ./docker/stratum/certbot-loop.sh:/scripts/certbot-loop.sh:ro
      - ${ALVENQIS_STATE_ROOT:-./state}/stratum/letsencrypt:/etc/letsencrypt
      - ${ALVENQIS_STATE_ROOT:-./state}/stratum/lib:/var/lib/letsencrypt
    secrets: [cloudflare_api_token]
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/letsencrypt/live/${STRATUM_HOST}/fullchain.pem && test -s /etc/letsencrypt/live/${STRATUM_HOST}/privkey.pem && test -s /etc/letsencrypt/.stratum-cert-ready"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 15s
    mem_limit: ${CERTBOT_MEMORY_LIMIT:-256M}
    cpus: ${CERTBOT_CPU_LIMIT:-0.20}
    pids_limit: 128

  alvenqis-pool:
    <<: *runtime-image
    env_file: [.env]
    environment: {ALVENQIS_COMPONENT: pool}
    ports: ["${STRATUM_BIND_ADDRESS:-0.0.0.0}:${STRATUM_PORT:-3333}:${STRATUM_INTERNAL_PORT:-3333}/tcp"]
    volumes:
      - ${ALVENQIS_STATE_ROOT:-./state}/config/generated:/config
      - ${ALVENQIS_STATE_ROOT:-./state}/pool:/data/pool
      - ${ALVENQIS_STATE_ROOT:-./state}/stratum/letsencrypt:/certs:ro
    secrets: [pool_admin_token]
    depends_on:
      alvenqis-rpc: {condition: service_healthy}
      stratum-certbot: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '^alvenqis-mining-pool ' >/dev/null && test -s /certs/live/${STRATUM_HOST}/fullchain.pem && test -s /certs/live/${STRATUM_HOST}/privkey.pem"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: ${POOL_MEMORY_LIMIT:-768M}
    cpus: ${POOL_CPU_LIMIT:-0.75}
    pids_limit: 512
    stop_grace_period: 60s
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_keepalive_time: "60"
      net.ipv4.tcp_keepalive_intvl: "15"
      net.ipv4.tcp_keepalive_probes: "4"
