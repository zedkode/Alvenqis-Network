bind_host = "127.0.0.1"
bind_port = 10787
network = "mainnet-candidate"
network_id = "alvenqis-mainnet-candidate"
human_name = "Alvenqis Mainnet Candidate"
status_label = "Planned / Mainnet Candidate"
address_prefix = "alve"
chain_data_path = "/var/lib/alvenqis/.alvenqis-mainnet/chain"
indexer_data_path = "/var/lib/alvenqis/.alvenqis-mainnet/indexer"
mempool_data_path = "/var/lib/alvenqis/.alvenqis-mainnet/mempool"
public_rpc_allowed = false
access_mode = "public-submit"
# Public submit/read profile. Solo mining uses local loopback RPC; the pool role
# renders private-mining=true only on the unpublished Docker network.
expose_mining_endpoints = false
max_mempool_transactions = 4096
max_request_body_bytes = 65536
cors_allowed_origin = "__PUBLIC_ORIGIN__"
cors_allowed_origins = ["__PUBLIC_ORIGIN__", "http://127.0.0.1:4173", "http://localhost:4173", "http://127.0.0.1:5173", "http://localhost:5173"]
allow_mainnet_candidate = true
