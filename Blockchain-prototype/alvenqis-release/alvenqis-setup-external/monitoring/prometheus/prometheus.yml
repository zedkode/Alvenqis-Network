global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    project: alvenqis-network
    brand: alvenqis
    environment: mainnet-candidate

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
        labels:
          service: prometheus

  # Host CPU / RAM / disk / network (node-exporter) + textfile metrics (backups)
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          service: host

  # Per-container CPU, memory, filesystem and network metrics.
  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: [cadvisor:8080]
        labels:
          service: containers

  # Cloudflare Tunnel connector health and request metrics.
  - job_name: cloudflared
    metrics_path: /metrics
    static_configs:
      - targets: [cloudflared:20241]
        labels:
          service: cloudflare-tunnel

  # Alvenqis chain / RPC / indexer / P2P / mempool / pool metrics (JSON → Prometheus)
  - job_name: alvenqis-metrics
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [alvenqis-metrics-exporter:9101]
        labels:
          service: alvenqis-metrics
          brand: alvenqis

  # Blackbox only probes liveness. The metrics exporter owns the heavier
  # status/indexer/P2P reads and caches one real sample per scrape window.
  - job_name: alvenqis-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://alvenqis-rpc:10787/health
          - http://alvenqis-control:10788/health
          - http://alvenqis-ops:8080/health
          - http://alvenqis-metrics-exporter:9101/health
          - http://alvenqis-website:8080/healthz
          - http://alvenqis-explorer:8080/healthz
          - http://gateway:8080/gateway-health
          - http://grafana:3000/api/health
          - http://loki:3100/ready
        labels:
          brand: alvenqis
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Optional pool liveness. Readiness/upstream state comes from the cached
  # exporter sample and only alerts when ENABLE_POOL=true.
  - job_name: alvenqis-pool-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://alvenqis-pool:30787/health
        labels:
          brand: alvenqis
          service: pool
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Blackbox exporter self-metrics
  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]
        labels:
          service: blackbox-exporter
