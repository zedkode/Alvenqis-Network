groups:
  - name: alvenqis-core
    rules:
      - alert: AlvenqisEndpointDown
        expr: probe_success{job="alvenqis-http"} == 0
        for: 2m
        labels:
          severity: critical
          brand: alvenqis
          service: "{{ $labels.instance }}"
        annotations:
          summary: "Alvenqis endpoint is unreachable"
          description: "{{ $labels.instance }} has failed blackbox probes for more than two minutes."

      - alert: AlvenqisMetricsExporterDown
        expr: up{job="alvenqis-metrics"} == 0
        for: 2m
        labels:
          severity: critical
          brand: alvenqis
          service: alvenqis-metrics-exporter
        annotations:
          summary: "Alvenqis metrics exporter is down"
          description: "Prometheus cannot scrape alvenqis-metrics-exporter:9101."

      - alert: AlvenqisRpcUnreachable
        expr: alvenqis_rpc_up == 0
        for: 2m
        labels:
          severity: critical
          brand: alvenqis
          service: rpc
        annotations:
          summary: "Alvenqis RPC status is unreachable"
          description: "The metrics exporter cannot reach alvenqis-rpc /status."

      - alert: AlvenqisContainerMetricsDown
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: critical
          brand: alvenqis
          service: cadvisor
        annotations:
          summary: "Container metrics are unavailable"
          description: "Prometheus cannot scrape cAdvisor."

      - alert: AlvenqisCloudflareTunnelMetricsDown
        expr: up{job="cloudflared"} == 0
        for: 2m
        labels:
          severity: critical
          brand: alvenqis
          service: cloudflare-tunnel
        annotations:
          summary: "Cloudflare Tunnel connector is unavailable"
          description: "Prometheus cannot scrape the active cloudflared connector."

      - alert: AlvenqisContainerMemoryPressure
        expr: |
          (
            container_memory_working_set_bytes{name=~"alvenqis-.+"}
            /
            container_spec_memory_limit_bytes{name=~"alvenqis-.+"}
          ) > 0.90
          and container_spec_memory_limit_bytes{name=~"alvenqis-.+"} > 0
        for: 10m
        labels:
          severity: warning
          brand: alvenqis
          service: containers
        annotations:
          summary: "Alvenqis container memory pressure"
          description: "{{ $labels.name }} has used more than 90% of its memory limit for ten minutes."

      - alert: AlvenqisContainerOom
        expr: increase(container_oom_events_total{name=~"alvenqis-.+"}[10m]) > 0
        labels:
          severity: critical
          brand: alvenqis
          service: containers
        annotations:
          summary: "Alvenqis container OOM event"
          description: "{{ $labels.name }} reported an out-of-memory event."

      - alert: AlvenqisIndexerLagging
        expr: alvenqis_indexer_lag_blocks_effective > 5
        for: 10m
        labels:
          severity: warning
          brand: alvenqis
          service: indexer
        annotations:
          summary: "Alvenqis indexer is lagging"
          description: "Indexer lag is {{ $value }} blocks for more than ten minutes."

      - alert: AlvenqisIndexerOutOfSync
        expr: alvenqis_indexer_in_sync_effective == 0 and alvenqis_chain_ready == 1
        for: 15m
        labels:
          severity: warning
          brand: alvenqis
          service: indexer
        annotations:
          summary: "Alvenqis indexer out of sync"
          description: "Indexer tip does not match chain tip for more than fifteen minutes."

      - alert: AlvenqisNoPeers
        expr: alvenqis_p2p_validated_peers == 0 and alvenqis_chain_ready == 1
        for: 15m
        labels:
          severity: warning
          brand: alvenqis
          service: p2p
        annotations:
          summary: "Alvenqis node has no P2P peers"
          description: "validated_peer_count has remained 0 for fifteen minutes."

      - alert: AlvenqisP2pStatusUnreachable
        expr: alvenqis_p2p_up == 0
        for: 2m
        labels:
          severity: critical
          brand: alvenqis
          service: p2p
        annotations:
          summary: "Alvenqis P2P status is unreachable"
          description: "The live /p2p/status endpoint has failed for more than two minutes."

      - alert: AlvenqisPoolDown
        expr: alvenqis_pool_enabled == 1 and alvenqis_pool_up == 0
        for: 5m
        labels:
          severity: critical
          brand: alvenqis
          service: pool
        annotations:
          summary: "Alvenqis pool is down"
          description: "ENABLE_POOL is true but pool status is unreachable."

      - alert: HostDiskAlmostFull
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.10
        for: 10m
        labels:
          severity: critical
          brand: alvenqis
          service: host-storage
        annotations:
          summary: "Host disk has less than 10% free space"
          description: "Filesystem {{ $labels.mountpoint }} is nearly full."

      - alert: HostDiskPressure
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) < 0.15
        for: 15m
        labels:
          severity: warning
          brand: alvenqis
          service: host-storage
        annotations:
          summary: "Host disk has less than 15% free space"
          description: "Filesystem {{ $labels.mountpoint }} is approaching the retention safety threshold."

      - alert: HostMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels:
          severity: warning
          brand: alvenqis
          service: host-memory
        annotations:
          summary: "Host memory pressure"
          description: "Available memory has remained below 10% for ten minutes."

      - alert: AlvenqisBackupStale
        expr: time() - alvenqis_backup_last_success_unixtime > 129600
        for: 15m
        labels:
          severity: critical
          brand: alvenqis
          service: backup
        annotations:
          summary: "Alvenqis backup is stale"
          description: "No successful backup has been recorded for more than 36 hours."
