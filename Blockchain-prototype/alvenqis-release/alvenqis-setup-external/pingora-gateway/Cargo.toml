[package]
name = "alvenqis-pingora-gateway"
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Project-operated Alvenqis edge gateway built on Cloudflare Pingora"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
futures-util = "0.3"
hex = "0.4"
http = "1.3"
log = "0.4"
lru = "0.16"
pingora = { version = "0.8.0", git = "https://github.com/cloudflare/pingora", rev = "402acae52ff29c4183b9eca55ffa3f77814a5ee0", default-features = false, features = ["connection_filter", "openssl", "proxy"] }
pingora-prometheus = { version = "0.8.0", git = "https://github.com/cloudflare/pingora", rev = "402acae52ff29c4183b9eca55ffa3f77814a5ee0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }

[lints]
workspace = true
