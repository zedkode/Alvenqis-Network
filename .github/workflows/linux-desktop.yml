name: Linux Desktop Standalone Release

on:
  push:
    tags:
      - "desktop-v*-linux.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Linux release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linux-desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    environment: candidate-release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: "13.2.0"
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Blockchain-prototype/alvenqis-desktop-v2/package-lock.json

      - name: Install Linux packaging dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          libsecret-1-dev libdbus-1-dev zenity fakeroot rpm libarchive-tools

      - name: Build Linux Control Center distributions
        run: bash Blockchain-scripts/release/build-linux-desktop.sh

      - name: Stage assets and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-publish/linux
          find release-artifacts/linux-v2 -maxdepth 1 -type f -exec cp {} release-publish/linux/ \;
          test -n "$(find release-publish/linux -type f -print -quit)"
          (
            cd release-publish/linux
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS-LINUX.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS-LINUX.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alvenqis-control-center-linux-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: release-publish/linux/*

      - name: Publish standalone Linux prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash Blockchain-scripts/github/generate-candidate-release-notes.sh \
            "$RELEASE_TAG" release-notes.md
          for attempt in 1 2 3 4 5; do
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 && break
            if gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Alvenqis Linux $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease; then
              break
            fi
            sleep "$attempt"
          done
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" release-publish/linux/*
