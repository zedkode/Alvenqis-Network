name: Candidate Windows Release

on:
  push:
    tags:
      - "desktop-v*-candidate.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing candidate tag, for example desktop-v2.0.1-candidate.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: candidate-windows-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-publish-windows:
    name: Build and publish Windows
    runs-on: windows-2025
    environment: candidate-release
    timeout-minutes: 120
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: "13.2.0"
          method: local

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Blockchain-prototype/alvenqis-desktop-v2/package-lock.json
            Blockchain-prototype/alvenqis-explorer/package-lock.json

      - name: Select and verify desktop release channel
        shell: bash
        run: |
          set -euo pipefail
          DESKTOP_CHANNEL=v2
          PACKAGE=./Blockchain-prototype/alvenqis-desktop-v2/package.json
          EXPECTED_PREFIX=desktop-v
          DESKTOP_VERSION="$(node -e "const j=require('$PACKAGE'); process.stdout.write(j.version)")"
          EXPECTED_TAG_PREFIX="${EXPECTED_PREFIX}${DESKTOP_VERSION}-candidate."
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG_PREFIX"* ]]; then
            echo "Release tag $RELEASE_TAG does not match $DESKTOP_CHANNEL version $DESKTOP_VERSION (expected ${EXPECTED_TAG_PREFIX}N)" >&2
            exit 1
          fi
          echo "DESKTOP_CHANNEL=$DESKTOP_CHANNEL" >> "$GITHUB_ENV"
          echo "DESKTOP_VERSION=$DESKTOP_VERSION" >> "$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "WINDOWS_CERTIFICATE GitHub secret is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD GitHub secret is required"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "alvenqis-code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable
            if (-not $certificate.HasPrivateKey) {
              throw "Imported code-signing certificate has no private key"
            }
            "ALVENQIS_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build signed Windows Tauri package
        shell: pwsh
        run: ./Blockchain-scripts/release/build-windows-installer.ps1 -DesktopChannel $env:DESKTOP_CHANNEL

      - name: Stage and verify Windows assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish/windows
          product="Alvenqis Control Center V2"
          slug="Alvenqis-Control-Center-V2"
          cp "release-artifacts/${product}_${DESKTOP_VERSION}_x64-setup.exe" \
            "release-publish/windows/${slug}-${DESKTOP_VERSION}-Windows-x64-Setup.exe"
          cp "release-artifacts/${slug}-${DESKTOP_VERSION}-Windows-x64-Portable.zip" \
            release-publish/windows/
          cp "release-artifacts/README-UPDATES-${DESKTOP_CHANNEL}.txt" \
            release-publish/windows/

          if find release-publish/windows -iname '*electron*' | grep -q .; then
            echo "Electron artifacts must not ship" >&2
            find release-publish/windows -iname '*electron*'
            exit 1
          fi
          if find release-publish/windows \( -name 'latest.yml' -o -name 'latest-linux.yml' \) | grep -q .; then
            echo "Legacy Electron updater metadata must not ship" >&2
            exit 1
          fi
          test -n "$(find release-publish/windows -type f \( -name '*.exe' -o -name '*.zip' \) -print -quit)"

          (
            cd release-publish/windows
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          ls -la release-publish/windows

      - name: Keep Windows build as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-windows-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: release-publish/windows/*

      - name: Create or reuse candidate prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Mainnet Candidate prerelease — not public Mainnet

          Windows, Linux, and VPS assets are built independently from the same candidate tag. A platform failure remains visible and does not certify another platform.

          The desktop product is Tauri-based. Electron, CPU mining, and OpenCL mining are not shipped. Verify every platform-specific SHA-256 checksum file before testing an asset.
          EOF

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Alvenqis $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi

      - name: Upload Windows assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-publish/windows/*
