name: Candidate Setup External Release

on:
  push:
    tags:
      - "v*-candidate.*"
      - "desktop-v*-candidate.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing candidate tag, for example v1.0.0-candidate.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: candidate-setup-external-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-publish-setup-external:
    name: Build and publish Alvenqis Setup External
    runs-on: ubuntu-24.04
    environment: candidate-release
    timeout-minutes: 120
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install RocksDB build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libclang-dev

      - name: Check RocksDB runtime feature
        run: cargo check --manifest-path Blockchain-prototype/Cargo.toml -p alvenqis-node --locked --features storage-rocksdb

      - name: Install control-plane validation parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate Docker control plane
        working-directory: Blockchain-prototype/alvenqis-release/alvenqis-setup-external
        run: bash ./scripts/validate-stack.sh --require-docker

      - name: Build RocksDB runtime image
        run: docker build --file Blockchain-prototype/alvenqis-release/alvenqis-setup-external/docker/Dockerfile --tag alvenqis-runtime:candidate .

      - name: Build Alvenqis Setup External bundle
        run: bash Blockchain-scripts/release/build-alvenqis-setup-external-bundle.sh

      - name: Stage and verify Setup External assets
        run: |
          set -euo pipefail
          mkdir -p release-publish/setup-external

          find alvenqis-release -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release-publish/setup-external/ \; 2>/dev/null || true
          find release-artifacts -maxdepth 1 -type f \
            -iname '*setup-external*' \
            -exec cp {} release-publish/setup-external/ \; 2>/dev/null || true

          test -n "$(find release-publish/setup-external -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"

          (
            cd release-publish/setup-external
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS-SETUP-EXTERNAL.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS-SETUP-EXTERNAL.txt
          )
          ls -la release-publish/setup-external

      - name: Keep Setup External build as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-setup-external-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: release-publish/setup-external/*

      - name: Create or reuse candidate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash Blockchain-scripts/github/generate-candidate-release-notes.sh \
            "$RELEASE_TAG" release-notes.md
          for attempt in 1 2 3 4 5; do
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 && break
            if gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Alvenqis $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease; then
              break
            fi
            sleep "$attempt"
          done
          gh release view "$RELEASE_TAG" >/dev/null

      - name: Upload Setup External assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-publish/setup-external/*
