name: Alvenqis Setup External Images (Manual Only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit image tag (latest is forbidden)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: setup-external-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install validation parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Reject mutable tag
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          test "$IMAGE_VERSION" != "latest"
          printf '%s' "$IMAGE_VERSION" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'
      - name: Validate secure stack
        working-directory: Blockchain-prototype/alvenqis-release/alvenqis-setup-external
        run: bash ./scripts/validate-stack.sh --require-docker

      - name: Smoke-build RocksDB runtime image
        run: docker build --file Blockchain-prototype/alvenqis-release/alvenqis-setup-external/docker/Dockerfile --tag alvenqis-runtime:smoke .

  build:
    needs: validate
    runs-on: ubuntu-24.04
    environment: candidate-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alvenqis-runtime
            context: .
            dockerfile: Blockchain-prototype/alvenqis-release/alvenqis-setup-external/docker/Dockerfile
          - image: alvenqis-ops
            context: Blockchain-prototype/alvenqis-release/alvenqis-setup-external
            dockerfile: Blockchain-prototype/alvenqis-release/alvenqis-setup-external/docker/ops/Dockerfile
          - image: alvenqis-backup-scheduler
            context: Blockchain-prototype/alvenqis-release/alvenqis-setup-external
            dockerfile: Blockchain-prototype/alvenqis-release/alvenqis-setup-external/docker/backup-scheduler/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an existing immutable image tag
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "Image tag already exists and is immutable: $IMAGE_REF" >&2
            exit 1
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
