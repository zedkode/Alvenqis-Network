name: Rust CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Blockchain-prototype/Cargo.toml"
      - "Blockchain-prototype/Cargo.lock"
      - "Blockchain-prototype/**/Cargo.toml"
      - "Blockchain-prototype/**/*.rs"
      - "Blockchain-prototype/**/build.rs"
      - "Blockchain-prototype/**/*.c"
      - "Blockchain-prototype/**/*.cc"
      - "Blockchain-prototype/**/*.cpp"
      - "Blockchain-prototype/**/*.cu"
      - "Blockchain-prototype/**/*.h"
      - "Blockchain-prototype/**/*.hpp"
      - ".cargo/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Blockchain-prototype/Cargo.toml"
      - "Blockchain-prototype/Cargo.lock"
      - "Blockchain-prototype/**/Cargo.toml"
      - "Blockchain-prototype/**/*.rs"
      - "Blockchain-prototype/**/build.rs"
      - "Blockchain-prototype/**/*.c"
      - "Blockchain-prototype/**/*.cc"
      - "Blockchain-prototype/**/*.cpp"
      - "Blockchain-prototype/**/*.cu"
      - "Blockchain-prototype/**/*.h"
      - "Blockchain-prototype/**/*.hpp"
      - ".cargo/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Blockchain-prototype
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: Blockchain-prototype -> target

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libclang-dev libdbus-1-dev
        working-directory: .

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Test RocksDB state backend
        run: cargo test -p alvenqis-node --locked --features storage-rocksdb --lib

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run RocksDB Clippy
        run: cargo clippy -p alvenqis-node --all-targets --locked --features storage-rocksdb -- -D warnings
