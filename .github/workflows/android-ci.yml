name: Android Client CI

on:
  push:
    branches: [main]
    paths:
      - "Blockchain-prototype/alvenqis-android/**"
      - "Blockchain-prototype/alvenqis-mobile-core/**"
      - "Blockchain-prototype/alvenqis-core/**"
      - "Blockchain-prototype/Cargo.lock"
      - "Blockchain-prototype/Cargo.toml"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "Blockchain-prototype/alvenqis-android/**"
      - "Blockchain-prototype/alvenqis-mobile-core/**"
      - "Blockchain-prototype/alvenqis-core/**"
      - "Blockchain-prototype/Cargo.lock"
      - "Blockchain-prototype/Cargo.toml"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Setup Rust Android targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build and verify Android debug APK
        working-directory: Blockchain-prototype/alvenqis-android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebugAndroidTest assembleDebug verifyDebugNativeLibraries

      - name: Upload Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alvenqis-android-debug
          if-no-files-found: error
          path: Blockchain-prototype/alvenqis-android/app/build/outputs/apk/debug/*.apk
