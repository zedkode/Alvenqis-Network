name: Candidate Linux Components Release

on:
  push:
    tags:
      - "v*-candidate.*"
      - "desktop-v*-candidate.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing candidate tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: candidate-linux-components-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-publish:
    name: Build and publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    environment: candidate-release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component:
          - node
          - rpc
          - indexer
          - explorer
          - pool
          - wallet-cli
          - miner
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install Rust toolchain
        if: matrix.component != 'explorer'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install Rust system dependencies
        if: matrix.component != 'explorer'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libclang-dev libdbus-1-dev

      - name: Install CUDA toolkit for miner
        if: matrix.component == 'miner'
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: "13.2.0"
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Setup Node.js for explorer
        if: matrix.component == 'explorer'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Blockchain-prototype/alvenqis-explorer/package-lock.json

      - name: Test and package component
        run: |
          set -euo pipefail
          bash Blockchain-scripts/release/build-linux-component-artifact.sh \
            "${{ matrix.component }}" release-publish/component
          (
            cd release-publish/component
            for manifest in *.sha256; do
              sha256sum -c "$manifest"
            done
          )

      - name: Keep component as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ matrix.component }}-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: release-publish/component/*

      - name: Create or reuse candidate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash Blockchain-scripts/github/generate-candidate-release-notes.sh \
            "$RELEASE_TAG" release-notes.md
          for attempt in 1 2 3 4 5; do
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 && break
            if gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Alvenqis $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease; then
              break
            fi
            sleep "$attempt"
          done
          gh release view "$RELEASE_TAG" >/dev/null

      - name: Upload passing component to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-publish/component/*
