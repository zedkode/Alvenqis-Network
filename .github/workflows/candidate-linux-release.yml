name: Candidate Linux Release

on:
  push:
    tags:
      - "desktop-v*-candidate.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing candidate tag, for example desktop-v2.0.1-candidate.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: candidate-linux-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-publish-linux:
    name: Build and publish Linux
    runs-on: ubuntu-24.04
    environment: candidate-release
    timeout-minutes: 120
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: "13.2.0"
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Blockchain-prototype/alvenqis-desktop-v2/package-lock.json
            Blockchain-prototype/alvenqis-explorer/package-lock.json

      - name: Install Linux packaging dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          libsecret-1-dev libdbus-1-dev zenity fakeroot rpm libarchive-tools xdg-utils

      - name: Verify tag matches desktop version
        run: |
          set -euo pipefail
          DESKTOP_VERSION="$(node -e "const j=require('./Blockchain-prototype/alvenqis-desktop-v2/package.json'); process.stdout.write(j.version)")"
          case "$RELEASE_TAG" in
            "desktop-v${DESKTOP_VERSION}-candidate."*) ;;
            *)
              echo "Release tag $RELEASE_TAG does not match desktop version $DESKTOP_VERSION" >&2
              exit 1
              ;;
          esac

      - name: Build Linux Tauri packages
        run: bash Blockchain-scripts/release/build-linux-desktop.sh

      - name: Stage and verify Linux assets
        run: |
          set -euo pipefail
          mkdir -p release-publish/linux
          find release-artifacts/linux-v2 -maxdepth 1 -type f -exec cp {} release-publish/linux/ \;

          if find release-publish/linux -iname '*electron*' | grep -q .; then
            echo "Electron artifacts must not ship" >&2
            find release-publish/linux -iname '*electron*'
            exit 1
          fi
          if find release-publish/linux \( -name 'latest.yml' -o -name 'latest-linux.yml' \) | grep -q .; then
            echo "Legacy Electron updater metadata must not ship" >&2
            exit 1
          fi
          test -n "$(find release-publish/linux -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'alvenqis-control-center' \) -print -quit)"

          (
            cd release-publish/linux
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS-LINUX.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS-LINUX.txt
          )
          ls -la release-publish/linux

      - name: Keep Linux build as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-linux-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: release-publish/linux/*

      - name: Create or reuse candidate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash Blockchain-scripts/github/generate-candidate-release-notes.sh \
            "$RELEASE_TAG" release-notes.md
          for attempt in 1 2 3 4 5; do
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 && break
            if gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Alvenqis $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease; then
              break
            fi
            sleep "$attempt"
          done
          gh release view "$RELEASE_TAG" >/dev/null

      - name: Upload Linux assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-publish/linux/*
