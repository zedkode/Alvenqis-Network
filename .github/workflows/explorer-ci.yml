name: Explorer CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Blockchain-prototype/alvenqis-explorer/**"
      - ".github/workflows/explorer-ci.yml"
  pull_request:
    paths:
      - "Blockchain-prototype/alvenqis-explorer/**"
      - ".github/workflows/explorer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explorer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Blockchain-prototype/alvenqis-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Blockchain-prototype/alvenqis-explorer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint explorer
        run: npm run lint

      - name: Build explorer
        run: npm run build
